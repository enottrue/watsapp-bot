services:
  watsapp:
    build: .
    container_name: watsapp
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-unofficial}
      - WHATSAPP_SESSION_PATH=/app/sessions
    volumes:
      - watsapp_sessions:/app/sessions
      - watsapp_uploads:/app/uploads
    networks:
      - bmad-shared
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://localhost:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  bmad-shared:
    external: true

volumes:
  watsapp_sessions:
  watsapp_uploads:
